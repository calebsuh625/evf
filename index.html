<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend Tutoring</title>
<meta name="description" content="Volunteer tutoring program coordinator. Runs entirely in your browser.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/tutor.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true">◆</span>
      <span class="brand__text" data-i18n="app.title">Weekend Tutoring</span>
    </a>

    <nav class="nav" id="nav" aria-label="Main">
      <!-- links injected by app.js -->
    </nav>

    <div class="app-header__tools">
      <!-- No auth yet: the app asks who is looking, and remembers. -->
      <div class="role-picker" id="role-picker"></div>
      <button type="button" class="lang-toggle" id="lang-toggle" aria-live="polite">
        <span data-i18n="lang.toggle">中文</span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="app-main" tabindex="-1">
  <div class="view" id="view">
    <!-- views render here -->
  </div>
</main>

<footer class="app-footer">
  <p>
    <span data-i18n="footer.local">All data stays in this browser. Export to keep it.</span>
    <span class="app-footer__sep" aria-hidden="true">·</span>
    <a href="#/selftest" data-i18n="footer.selftest">Time zone self-test</a>
    <span class="app-footer__sep" aria-hidden="true">·</span>
    <a href="tests/test.html" data-i18n="footer.tests">Run tests</a>
  </p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!--
  Boot guard (classic script, deliberately not a module).
  ES modules are blocked over the file:// protocol in Chromium and Firefox,
  so if this page was double-clicked instead of served, app.js never runs.
  We detect that and say so plainly rather than showing a blank page.
-->
<script>
(function () {
  window.__EVF_BOOTED = false;
  var GUARD_MS = 1500;

  function showBootHelp() {
    if (window.__EVF_BOOTED) return;
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML = [
      '<section class="boot-help">',
      '<h1>This page needs to be served over HTTP</h1>',
      '<p>The app is built from ES modules. Browsers refuse to load modules',
      'from a <code>file://</code> URL, so opening <code>index.html</code> by',
      'double-clicking cannot work &mdash; in any app built this way.</p>',
      '<p>From the folder containing this file, run one of:</p>',
      '<pre><code>python3 -m http.server 8000\nnpx serve .</code></pre>',
      '<p>Then open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>',
      '<p class="boot-help__note">Deployed on GitHub Pages this is already HTTP,',
      'so it just works there.</p>',
      '</section>'
    ].join(' ');
  }

  window.setTimeout(showBootHelp, GUARD_MS);
})();
</script>

<script type="module" src="js/app.js"></script>

</body>
</html>
